<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiket Masuk SPEC CAMP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .ticket-bg {
            background-image: linear-gradient(rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.6)), 
                              url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-gray-200 flex items-center justify-center min-h-screen p-4">

    <!-- Container Tiket Utama -->
    <div class="flex w-full max-w-6xl bg-white shadow-2xl rounded-sm overflow-hidden border border-gray-300">
        
        <!-- Bagian Kiri (Sidebar Hijau) -->
        <div class="w-1/3 bg-[#3c513e] p-8 relative flex flex-col">
            <!-- Aksen Orange Pojok Kiri Bawah -->
            <div class="absolute bottom-0 left-0 w-24 h-20 bg-[#e68e54] rounded-tr-[100px] -ml-6 -mb-6 opacity-90"></div>
            
            <div class="relative z-10">
                <!-- Label Tiket Masuk -->
                <div class="bg-[#2d3a2e] text-white text-sm px-4 py-1 inline-block mb-6 tracking-wider font-semibold">
                    TIKET MASUK
                </div>

                <!-- Judul -->
                <h1 class="text-[#e68e54] text-3xl font-black leading-none mb-1">Camping Ground</h1>
                <h2 class="text-white text-5xl font-black tracking-widest mb-12">SPEC CAMP</h2>

                <!-- Input Fields -->
                <div class="space-y-8">
                    <div>
                        <label class="text-white text-lg block mb-2">Nomor Tiket:</label>
                        <div class="bg-white h-14 w-full shadow-inner"></div>
                    </div>
                    <div>
                        <label class="text-white text-lg block mb-2">Nama Pemilik Tiket:</label>
                        <div class="bg-white h-14 w-full shadow-inner"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Garis Putus-putus Perforasi -->
        <div class="w-1 border-l-4 border-dashed border-[#2d3a2e] bg-[#3c513e] relative">
            <!-- Lubang Atas & Bawah -->
            <div class="absolute -top-4 -left-3 w-6 h-6 bg-gray-200 rounded-full"></div>
            <div class="absolute -bottom-4 -left-3 w-6 h-6 bg-gray-200 rounded-full"></div>
        </div>

        <!-- Bagian Kanan (Informasi Detail) -->
        <div class="w-2/3 ticket-bg relative p-10 flex flex-col justify-between overflow-hidden">
            
            <!-- Logo Shield Pojok Kanan Atas -->
            <div class="absolute top-4 right-6 w-16 h-20 bg-[#3c513e] rounded-b-lg flex flex-col items-center justify-center p-1 shadow-lg">
                <div class="border border-white w-full h-full flex flex-col items-center justify-center text-[8px] text-white leading-tight font-bold">
                    <span class="text-[10px]">SPEC</span>
                    <span>CAMPING</span>
                    <div class="w-6 h-6 my-1 bg-white rounded-full flex items-center justify-center">
                        <span class="text-[#3c513e]">🐎</span>
                    </div>
                </div>
            </div>

            <!-- Aksen Orange & Dot -->
            <div class="absolute top-0 right-20 w-32 h-16 bg-[#e68e54] rounded-bl-full opacity-80"></div>
            <div class="absolute bottom-20 left-4 grid grid-cols-2 gap-2 opacity-40">
                <div class="w-1.5 h-1.5 bg-[#e68e54] rounded-full"></div><div class="w-1.5 h-1.5 bg-[#e68e54] rounded-full"></div>
                <div class="w-1.5 h-1.5 bg-[#e68e54] rounded-full"></div><div class="w-1.5 h-1.5 bg-[#e68e54] rounded-full"></div>
                <div class="w-1.5 h-1.5 bg-[#e68e54] rounded-full"></div><div class="w-1.5 h-1.5 bg-[#e68e54] rounded-full"></div>
            </div>

            <div>
                <!-- Header Logo -->
                <div class="flex items-center gap-3 mb-6">
                    <img src="https://cdn-icons-png.flaticon.com/512/3063/3063076.png" class="w-12 h-12 grayscale brightness-50" alt="logo">
                    <span class="text-2xl font-bold text-gray-800 tracking-tight">SPEC CAMP</span>
                </div>

                <!-- Label Tiket Masuk -->
                <div class="bg-[#566e58] text-white text-lg px-6 py-1 inline-block mb-6 font-semibold shadow-md">
                    TIKET MASUK
                </div>

                <!-- Judul Utama -->
                <h1 class="text-[#2d3a2e] text-4xl font-[900] leading-none mb-3 uppercase tracking-tighter">
                    Sukabumi Prestige Equestrian Center
                </h1>
                <p class="text-gray-800 text-2xl font-medium mb-8 leading-tight">
                    Destinasi berkuda dan perkemahan premium di jantung Sukabumi
                </p>

                <!-- Lokasi -->
                <div class="flex items-start gap-3 text-gray-900 max-w-lg">
                    <div class="mt-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-[#3c513e]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </div>
                    <p class="text-lg font-bold leading-snug">
                        Kp. Cipari, RT.003/RW.005, Tenjolaya, Kec. Cicurug,<br>
                        Kabupaten Sukabumi, Jawa Barat
                    </p>
                </div>
            </div>

            <!-- Bagian Bawah: Nomor Tiket -->
            <div class="mt-10 flex items-center gap-4">
                <span class="text-2xl font-bold text-gray-800">Nomor Tiket:</span>
                <div class="bg-white border-2 border-gray-400 h-14 w-80 shadow-md"></div>
            </div>

            <!-- Bayangan Siluet Kuda (Dekoratif) -->
            <div class="absolute right-0 bottom-0 opacity-10 -mr-10 -mb-10">
                <img src="https://cdn-icons-png.flaticon.com/512/3063/3063076.png" class="w-96 h-96" alt="silhouette">
            </div>
        </div>
    </div>

</body>
</html>
